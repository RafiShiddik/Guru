{% extends "base.html" %}

{% block title %}Lupa Password - Portal Guru{% endblock %}

{% block login_content %}
<div class="login-container">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--text-primary);">RESET PASSWORD GURU</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">Masukkan kata kunci rahasia untuk mereset password akun pengajar</p>
    </div>

    {% if error %}
      <div class="glass-card" style="border-color: var(--accent-rose); background: rgba(244, 63, 94, 0.12); padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
        <i class="ph ph-warning-circle" style="color: var(--accent-rose); font-size: 1.3rem;"></i>
        <span style="font-size: 0.9rem; color: #fff;">{{ error }}</span>
      </div>
    {% endif %}

    <form action="{{ url_for('lupa_password') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="namaGuru">Nama Guru Pengajar <span style="color: var(--accent-rose);">*</span></label>
        <select name="nama" id="namaGuru" class="form-select" style="padding: 0.95rem 1.1rem; font-size: 1rem; font-weight: 600;" required>
          <option value="" disabled selected>-- Pilih Nama Guru --</option>
          {% for t in teachers %}
            <option value="{{ t }}">{{ t }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group" style="margin-top: 1.25rem;">
        <label class="form-label" for="secret_key">Kata Kunci Rahasia <span style="color: var(--accent-rose);">*</span></label>
        <input type="password" name="secret_key" id="secret_key" class="form-control" placeholder="Masukkan kata kunci rahasia reset" style="padding: 0.95rem 1.1rem;" required>
      </div>

      <div class="form-group" style="margin-top: 1.25rem;">
        <label class="form-label" for="new_password">Password Baru <span style="color: var(--accent-rose);">*</span></label>
        <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Masukkan password baru" style="padding: 0.95rem 1.1rem;" required>
      </div>

      <div class="form-group" style="margin-top: 1.25rem;">
        <label class="form-label" for="confirm_password">Konfirmasi Password Baru <span style="color: var(--accent-rose);">*</span></label>
        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Ulangi password baru" style="padding: 0.95rem 1.1rem;" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.95rem; font-size: 1rem;">
        Reset & Simpan Password
      </button>

      <div style="text-align: center; margin-top: 1.25rem;">
        <a href="{{ url_for('login') }}" style="color: #ef4444; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
          Kembali ke Halaman Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
